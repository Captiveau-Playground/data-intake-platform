version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: football_intel
      POSTGRES_PASSWORD: football_intel_dev
      POSTGRES_DB: football_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U football_intel"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - football-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://football_intel:football_intel_dev@postgres:5432/football_intel
      SECRET_KEY: dev-secret-key-change-in-production
      CORS_ORIGINS: http://43.157.247.204:3000,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_uploads:/app/uploads
    networks:
      - football-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://43.157.247.204:3001
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL=http://43.157.247.204:3001
    depends_on:
      - api
    networks:
      - football-net

networks:
  football-net:
    driver: bridge

volumes:
  postgres_data:
  api_uploads:
